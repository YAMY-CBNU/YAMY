<!doctype html>

<html class="light" lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>레시피 검색 - YAMY</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="tailwind-index.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-surface text-on-surface font-body min-h-screen flex flex-col">
    <nav
      class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl flex justify-between items-center px-4 md:px-12 h-16 md:h-20 max-w-full mx-auto border-b border-outline-variant/30"
    >
      <div class="flex items-center gap-6 lg:gap-12">
        <a href="index.html" class="text-3xl font-extrabold text-primary font-headline tracking-tighter">YAMY</a>
        <div class="hidden md:flex items-center gap-5 lg:gap-8 font-headline tracking-tight whitespace-nowrap">
          <a class="text-primary border-b-2 border-primary pb-1 font-bold" href="index.html">탐색하기</a>
          <a id="nav-my-recipe" class="text-on-surface-variant hover:text-primary transition-colors" href="my-recipe.html">
            내 레시피
          </a>
          <a class="text-on-surface-variant hover:text-primary transition-colors" href="my-picks.html">저장됨</a>
          <a class="text-on-surface-variant hover:text-primary transition-colors" href="recipe-editor.html">레시피 작성</a>
        </div>
      </div>
      <div class="flex items-center gap-2 md:gap-3 lg:gap-6">
        <a
          href="profile.html"
          data-profile-link
          class="hidden items-center rounded-full bg-surface-container text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-all font-semibold p-2 lg:px-4 lg:py-2.5"
        >
          <span class="material-symbols-outlined lg:hidden">person</span>
          <span class="hidden lg:inline text-sm whitespace-nowrap" data-profile-text>프로필</span>
        </a>
        <a
          id="auth-action"
          href="login.html"
          class="bg-primary text-on-primary px-6 md:px-8 py-2.5 rounded-full font-headline font-bold text-sm hover:opacity-90 transition-all shadow-sm whitespace-nowrap"
        >로그인</a>
      </div>
    </nav>

    <main class="pt-24 md:pt-32 pb-24 flex-grow max-w-7xl w-full mx-auto px-4 md:px-8">
      <section class="mb-10">
        <span class="text-primary font-headline font-bold text-sm uppercase tracking-[0.3em] mb-2 block">
          RECIPE SEARCH
        </span>
        <h1 class="text-3xl md:text-5xl font-headline font-extrabold tracking-tight mb-6">레시피 검색</h1>
        <form id="search-results-form" class="relative max-w-2xl">
          <span class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-on-surface-variant">
            search
          </span>
          <input
            id="search-results-input"
            type="search"
            maxlength="100"
            autocomplete="off"
            class="w-full rounded-full border border-outline-variant/50 bg-surface-container-lowest pl-14 pr-28 py-4 text-base focus:border-primary focus:ring-primary"
            placeholder="제목, 설명, 재료로 검색..."
          />
          <button
            type="submit"
            class="absolute right-2 top-1/2 -translate-y-1/2 rounded-full bg-primary px-6 py-2.5 text-sm font-bold text-on-primary hover:opacity-90"
          >
            검색
          </button>
        </form>
      </section>

      <section>
        <div class="flex flex-wrap items-end justify-between gap-3 mb-7">
          <div>
            <h2 id="search-results-title" class="text-2xl md:text-3xl font-headline font-extrabold">검색 결과</h2>
            <p id="search-results-count" class="mt-2 text-sm text-on-surface-variant" aria-live="polite"></p>
          </div>
        </div>

        <div
          id="search-results-grid"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 md:gap-8"
          aria-live="polite"
        ></div>

        <div class="mt-10 flex justify-center">
          <button
            id="search-load-more"
            type="button"
            class="hidden rounded-full border border-primary/30 bg-surface-container px-8 py-3 text-sm font-bold text-primary hover:bg-primary hover:text-on-primary disabled:cursor-wait disabled:opacity-60"
          >
            더보기
          </button>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="auth-guard.js"></script>
    <script src="profile-badge.js"></script>
    <script src="footer-component.js"></script>
    <script src="search-results.js"></script>
  </body>
</html>
